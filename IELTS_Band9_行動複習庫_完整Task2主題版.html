grow/climb 不直接接受詞。","ex":"The number of visitors rose steadily.","coll":"increase to / rise to","source":"exam-use"},{"w":"level off","zh":"趨於平穩","syn":["stabilise","become stable"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"level off at","coll":"Sales levelled off at around 50,000.","source":"exam-use"},{"w":"moderately","zh":"適度地／中等幅度地","syn":["to a moderate degree"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"increase moderately","coll":"The figure increased moderately.","source":"exam-use"},{"w":"peak","zh":"高峰","syn":["highest point","maximum"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"reach a peak of","coll":"The figure reached a peak of 70% in 2020.","source":"exam-use"},{"w":"period","zh":"期間／時期","syn":["time","span"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"Task 1 常見 over the period / during this period。","ex":"The figure increased steadily over the period shown.","coll":"over the period / during this period","source":"exam-use"},{"w":"rapidly","zh":"快速地","syn":["quickly","at a fast rate"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"rise rapidly","coll":"Online sales rose rapidly after 2015.","source":"exam-use"},{"w":"relatively","zh":"相對地／比較地","syn":["comparatively","fairly","quite"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"Task 1 常見 relatively stable / relatively low。","ex":"The figure remained relatively stable throughout the period.","coll":"relatively stable / relatively low","source":"exam-use"},{"w":"remain","zh":"保持／維持","syn":["stay","continue to be","remain unchanged"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"remain + adjective/noun，例如 remain stable、remain unchanged。","ex":"The figure remained stable at around 50%.","coll":"remain stable / remain unchanged","source":"exam-use"},{"w":"remain unchanged","zh":"維持不變","syn":["stay the same","remain stable"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"remain unchanged at","coll":"The figure remained unchanged at 30%.","source":"exam-use"},{"w":"represent","zh":"代表／佔","syn":["account for","make up","stand for"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"比例時可換 account for/make up；象徵時可用 stand for。","ex":"Women represented 55% of the workforce.","coll":"represent 55% / stand for an idea","source":"exam-use"},{"w":"respectively","zh":"分別地","syn":["in that order","separately"],"topic":"圖表數據","skills":["R","L","W"],"level":"A","note":"讓前後資料依順序一一對應。","ex":"France and the UK recorded 40% and 50%, respectively.","coll":"A and B were X and Y, respectively","source":"exam-use"},{"w":"roughly","zh":"大約","syn":["approximately","around","about"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"四個都很常見。","ex":"Approximately 40% of students travelled by bus.","coll":"roughly/around 40%","source":"exam-use"},{"w":"share of","zh":"……的占比","syn":["proportion of","percentage of"],"topic":"圖表數據","skills":["R","L","W"],"level":"A","note":"share/proportion 最萬用；percentage 適合百分比。","ex":"Cars had the largest share of total spending.","coll":"the share/proportion of","source":"exam-use"},{"w":"sharply","zh":"急劇地","syn":["steeply","dramatically"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"rise/fall sharply","coll":"The figure fell sharply in the final year.","source":"exam-use"},{"w":"significantly","zh":"顯著地","syn":["considerably","substantially","greatly"],"topic":"圖表數據","skills":["R","L","W"],"level":"A","note":"表示明顯、大幅變化。","ex":"The figure increased significantly over the period.","coll":"increase significantly","source":"exam-use"},{"w":"slightly","zh":"輕微地","syn":["a little","marginally"],"topic":"圖表數據","skills":["R","L","W","S"],"level":"A","note":"表示變化幅度小。","ex":"Sales increased slightly." ":["R","L","W","S"],"level":"A","note":"essential＝非常重要；crucial＝關鍵；major 常修飾 issue/problem/reason。","ex":"Education plays a crucial role in a child’s development.","coll":"play an important/crucial role","source":"exam-use"},{"w":"issue","zh":"議題／問題","syn":["problem","matter"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a major issue","coll":"Climate change is a major global issue.","source":"exam-use"},{"w":"likely","zh":"可能的","syn":["probable","expected"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"be likely to","coll":"Young people are more likely to use social media.","source":"exam-use"},{"w":"major","zh":"主要的／重大的","syn":["main","significant"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a major problem","coll":"Pollution is a major problem in many cities.","source":"exam-use"},{"w":"method","zh":"方法","syn":["approach","way","technique"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a teaching method","coll":"Different teaching methods suit different learners.","source":"exam-use"},{"w":"minor","zh":"較小的／次要的","syn":["small","less important"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a minor change","coll":"Only a minor change was seen in the final year.","source":"exam-use"},{"w":"opportunity","zh":"機會","syn":["chance","possibility"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"provide an opportunity","coll":"Internships provide an opportunity to gain experience.","source":"exam-use"},{"w":"overall","zh":"整體而言","syn":["in general","generally"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"overall trend","coll":"Overall, the figures increased over the period.","source":"exam-use"},{"w":"possible","zh":"可能的","syn":["likely","potential"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a possible solution","coll":"Public transport is a possible solution to congestion.","source":"exam-use"},{"w":"previous","zh":"先前的","syn":["earlier","former"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"previous research","coll":"Previous research found similar results.","source":"exam-use"},{"w":"problem","zh":"問題","syn":["issue","challenge"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"issue 最安全；challenge 強調困難但可處理。","ex":"Traffic congestion is a major issue in large cities.","coll":"a serious problem / a major issue","source":"exam-use"},{"w":"provide","zh":"提供","syn":["offer","give"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"provide someone with","coll":"Schools should provide students with more support.","source":"exam-use"},{"w":"require","zh":"需要／要求","syn":["need","demand"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"require + noun / require someone to","coll":"This job requires strong communication skills.","source":"exam-use"},{"w":"significant","zh":"顯著的／重要的","syn":["considerable","substantial","important"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"描述數據變化時 significant ≈ considerable/substantial；表示『重要』時可換 important，但意思要看語境。","ex":"There was a significant increase in the number of visitors.","coll":"a significant increase / significant impact","source":"exam-use"},{"w":"solve","zh":"解決","syn":["address","deal with","tackle"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"address/tackle + problem；deal with + problem。","ex":"Governments should address this issue.","coll":"address an issue / tackle a problem","source":"exam-use"},{"w":"support","zh":"支持","syn":["help","assist"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"provide support","coll":"Parents should support children during stressful periods.","source":"exam-use"},{"w":"trend","zh":"趨勢","syn":["pattern","direction"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"a growing trend","coll":"Online shopping has become a growing trend.","source":"exam-use"},{"w":"unlikely","zh":"不太可能的","syn":["improbable","not likely"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"be unlikely to","coll":"People are unlikely to change without a clear benefit.","source":"exam-use"},{"w":"various","zh":"各種的","syn":["different","several"],"topic":"通用","skills":["R","L","W","S"],"level":"A","note":"依語境選擇最自然的替換，不要只為避免重複而硬換字。","ex":"various reasons","coll":"People exercise for various reasons.","source":"exam-use"},{"w":"in addition","zh":"此外","syn":["also","moreover","furthermore"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"Speaking 優先 also；Writing 可用 in addition / moreover。","ex":"In addition, the policy can reduce pollution.","coll":"in addition, + sentence","source":"exam-use"},{"w":"instead of","zh":"而不是","syn":["rather than","in place of"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"rather than 最實用。","ex":"People should take public transport rather than drive.","coll":"rather than + V / noun","source":"exam-use"},{"w":"therefore","zh":"因此","syn":["as a result","so","consequently"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"Speaking 用 so 最自然；Writing 用 therefore/as a result。","ex":"Public transport is cheaper, so more people may use it.","coll":"therefore + sentence","source":"exam-use"},{"w":"whereas","zh":"然而／相較之下","syn":["while","by contrast","in contrast"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"whereas/while 後接完整句；by contrast 通常用於新句。","ex":"The UK spent more on cars, whereas France spent slightly more on perfume.","coll":"A..., whereas B...","source":"exam-use"},{"w":"while","zh":"而／然而／同時","syn":["whereas","although","during the time that"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"Task 1 比較兩組資料時，while 很常等於 whereas。若表示時間或讓步，則不能直接替換。","ex":"The UK spent more on books, while France spent more on perfume.","coll":"A..., while B...","source":"exam-use"},{"w":"cheap","zh":"便宜的","syn":["inexpensive","affordable"],"topic":"金錢經濟","skills":["R","L","W","S"],"level":"A","note":"affordable＝負擔得起，不等於單純便宜。","ex":"Public transport should be affordable.","coll":"cheap/inexpensive/affordable","source":"exam-use"},{"w":"expensive","zh":"昂貴的","syn":["costly","high-priced"],"topic":"金錢經濟","skills":["R","L","W","S"],"level":"A","note":"costly 最實用。","ex":"Private healthcare can be costly.","coll":"expensive/costly","source":"exam-use"},{"w":"allow","zh":"允許","syn":["permit","enable"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"permit＝允許；enable＝使某人能夠做某事，句型不同。","ex":"Technology enables students to study anywhere.","coll":"allow/permit someone to / enable someone to","source":"exam-use"},{"w":"answer","zh":"回答","syn":["reply","response"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"response 是名詞；reply 可作動詞或名詞。","ex":"The student gave a clear response.","coll":"answer/response","source":"exam-use"},{"w":"ban","zh":"禁止","syn":["prohibit","forbid"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"prohibit 常見於文章與規則；forbid 也常見。","ex":"The law prohibits smoking in public places.","coll":"ban/prohibit","source":"exam-use"},{"w":"buy","zh":"購買","syn":["purchase"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"purchase 是 Reading / Listening 很常見的正式替換；Speaking 用 buy 最自然。","ex":"Consumers can purchase products online.","coll":"buy/purchase products","source":"exam-use"},{"w":"change","zh":"改變","syn":["alter","shift","transform"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"alter 常見閱讀；shift 常作名詞；transform 表示較大改變。","ex":"Technology has transformed the way people work.","coll":"change/alter/shift","source":"exam-use"},{"w":"choose","zh":"選擇","syn":["select","pick"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"select 常見於閱讀、聽力；pick 更口語。","ex":"Students can select from several courses.","coll":"choose/select","source":"exam-use"},{"w":"common","zh":"常見的","syn":["widespread","prevalent"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"widespread 非常常見；prevalent 稍正式，閱讀辨識很重要。","ex":"Online shopping is now widespread.","coll":"common/widespread","source":"exam-use"},{"w":"customer","zh":"顧客","syn":["consumer","client"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"consumer＝消費者；client 多為專業服務客戶。","ex":"Consumers are becoming more price-conscious.","coll":"customer/consumer/client","source":"exam-use"},{"w":"difficult","zh":"困難的","syn":["challenging","hard"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"challenging 常帶『具有挑戰性』的意味。","ex":"Learning a new language can be challenging.","coll":"difficult/challenging","source":"exam-use"},{"w":"easy","zh":"容易的","syn":["simple","straightforward"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"B","note":"straightforward＝直接、不複雜。","ex":"The process is simple and straightforward.","coll":"easy/simple","source":"exam-use"},{"w":"enough","zh":"足夠的","syn":["sufficient","adequate"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"sufficient/adequate 都很常見；adequate 有『足以應付』的感覺。","ex":"There is not enough space for all students.","coll":"enough/sufficient/adequate","source":"exam-use"},{"w":"far away","zh":"很遠","syn":["distant","remote"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"remote 常指偏遠，而不只是距離遠。","ex":"Some villages are located in remote areas.","coll":"far away/distant/remote","source":"exam-use"},{"w":"few","zh":"很少","syn":["limited","a small number of"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"limited 常表示數量或資源有限。","ex":"Only a small number of people took part.","coll":"few/limited","source":"exam-use"},{"w":"finish","zh":"完成／結束","syn":["complete","end"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"complete 常搭配 task/course/form；end 偏『結束』。","ex":"Students must complete the course.","coll":"finish/complete a task","source":"exam-use"},{"w":"get","zh":"取得／得到","syn":["obtain","receive","gain"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"obtain＝取得；receive＝收到；gain 常搭配 experience/knowledge。","ex":"Students can obtain information online.","coll":"obtain information / gain experience","source":"exam-use"},{"w":"idea","zh":"想法／概念","syn":["view","concept","notion"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"view＝觀點；concept/notion＝概念。","ex":"People have different views on this issue.","coll":"idea/view/concept","source":"exam-use"},{"w":"immediately","zh":"立刻","syn":["straight away","at once","instantly"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"straight away 口語；instantly 偏『瞬間』。","ex":"Please contact the office immediately.","coll":"immediately/at once","source":"exam-use"},{"w":"improve","zh":"改善","syn":["enhance","develop","boost"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"enhance 常見閱讀；develop 常搭配 skills；boost 表示提升。","ex":"The program can improve students' skills.","coll":"improve/enhance/boost","source":"exam-use"},{"w":"mainly","zh":"主要地","syn":["primarily","mostly","largely"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"primarily/largely 常見於閱讀；mostly 口語自然。","ex":"The service is mainly used by students.","coll":"mainly/primarily/mostly","source":"exam-use"},{"w":"many","zh":"許多","syn":["numerous","a large number of"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"numerous 常見於閱讀；寫作可偶爾使用。","ex":"Numerous studies have examined this issue.","coll":"many/numerous","source":"exam-use"},{"w":"nearby","zh":"附近的","syn":["close to","near"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"close to / near 很常見。","ex":"There is a bus stop close to t n most stores.","coll":"shop/store","source":"exam-use"},{"w":"sometimes","zh":"有時","syn":["occasionally","from time to time"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"occasionally 很常見；from time to time 口語自然。","ex":"I occasionally read books before bed.","coll":"sometimes/occasionally","source":"exam-use"},{"w":"start","zh":"開始","syn":["begin","commence"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"begin 最安全；commence 偏正式，辨識即可。","ex":"The course begins in September.","coll":"start/begin","source":"exam-use"},{"w":"stop","zh":"停止／防止","syn":["prevent","halt"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"prevent 多為『防止某事發生』；halt 是停止進行。","ex":"The policy aims to prevent further damage.","coll":"prevent / halt","source":"exam-use"},{"w":"use","zh":"使用","syn":["employ","make use of"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"B","note":"Reading 常見 employ 表示『使用某方法』；Speaking 不必刻意用。","ex":"The study employed several different methods.","coll":"use/employ a method","source":"exam-use"},{"w":"usually","zh":"通常","syn":["generally","normally","typically"],"topic":"閱讀聽力","skills":["R","L","W","S"],"level":"A","note":"generally/typically 很常見於閱讀。","ex":"Students typically spend two years on the course.","coll":"usually/generally/typically","source":"exam-use"},{"w":"however","zh":"然而／不過","syn":["nevertheless","nonetheless","but"],"topic":"連接詞","skills":["R","L","W","S"],"level":"A","note":"Writing 中 however 很安全；後接完整句時常寫 However, + sentence。Speaking 通常直接用 but 更自然。","ex":"However, this approach may create additional problems.","coll":"However, + sentence","source":"exam-use"},{"w":"in conclusion","zh":"總而言之／結論是","syn":["to conclude","overall","in summary"],"topic":"連接詞","skills":["R","W","S"],"level":"A","note":"Task 2 結論段最安全的開頭之一。overall 常用於 Task 1 overview，不建議把所有情況都直接互換。","ex":"In conclusion, governments and individuals should share responsibility for protecting the environment.","coll":"In conclusion, + sentence","sourc dom.", "chain": "targeted policy → protection/support → lower social problems", "example": "Governments can provide basic services for elderly or low-income residents."}]}, "Space Exploration": {"zh": "太空探索", "angles": [{"key": "個人能力", "angle": "個人能力 Science & innovation", "positive": "Space research can produce new knowledge and technology.", "negative": "The benefits may not be immediate or directly useful to ordinary people.", "chain": "research → new discoveries → new technology → wider applications", "example": "Satellite research has improved communication and weather monitoring."}, {"key": "金錢", "angle": "金錢 Cost", "positive": "Space programs can create skilled jobs and technological industries.", "negative": "They require large budgets that could be spent on urgent social needs.", "chain": "public investment → research/jobs → innovation, but high opportunity cost", "example": "Governments must balance space spending with healthcare and education."}, {"key": "人際社會", "angle": "人際社會 International cooperation", "positive": "Space projects can encourage countries to share knowledge and resources.", "negative": "Political competition can make cooperation difficult.", "chain": "shared research → shared knowledge → faster progress", "example": "Countries can cooperate on scientific missions."}]}, "Sport & Exercise": {"zh": "運動與健身", "angles": [{"key": "健康", "angle": "健康 Physical & mental health", "positive": "Regular exercise improves physical health and reduces stress.", "negative": "Competitive sport can cause injuries or excessive pressure.", "chain": "exercise → stronger body/lower stress → better health", "example": "Schools can provide regular sports classes."}, {"key": "人際社會", "angle": "人際社會 Teamwork", "positive": "Team sports teach cooperation and help people build relationships.", "negative": "Too much competition can create conflict or pressure.", "chain": "shared goals → teamwork → communication → stronger social skills", "example": "Playing basketball can rsities."}]}, "Tourism and Travel": {"zh": "旅遊與觀光", "angles": [{"key": "金錢", "angle": "金錢 Economy", "positive": "Tourism creates jobs and brings money into local communities.", "negative": "Local economies may become too dependent on tourists.", "chain": "more visitors → more spending → more local jobs → higher income", "example": "Tourists spend money on hotels, restaurants and local transport."}, {"key": "人際社會", "angle": "人際社會 Culture", "positive": "Travel helps people understand different cultures and ways of life.", "negative": "Mass tourism can weaken local traditions or disturb residents.", "chain": "cultural contact → better understanding → greater tolerance", "example": "Visitors can learn local customs by joining cultural activities."}, {"key": "環境未來", "angle": "環境未來 Environment", "positive": "Eco-tourism can provide money for conservation.", "negative": "Flights, waste and overcrowding can damage the environment.", "chain": "mass tourism → more transport/waste → more pollution → environmental pressure", "example": "Popular natural sites may need visitor limits."}, {"key": "政策規範", "angle": "政策規範 Policy", "positive": "Governments can manage visitor numbers and protect important sites.", "negative": "Strict tourism rules may reduce local business income.", "chain": "clear rules → controlled tourism → less damage → sustainable growth", "example": "Cities can limit visitor numbers in overcrowded historic areas."}]}, "Transport": {"zh": "交通", "angles": [{"key": "時間效率", "angle": "時間效率 Time & efficiency", "positive": "Efficient transport reduces commuting time.", "negative": "Poor systems create congestion and lost productivity.", "chain": "better transport → shorter trips → less stress → higher productivity", "example": "More frequent buses can reduce waiting time."}, {"key": "環境未來", "angle": "環境未來 Environment", "positive": "Public transport reduces emissions per passenger.", "negative": "Large infrastructure projects can disturb local areas.", "chain": "fewer private cars → lower emissions → cleaner air → better health", "example": "Cities can expand rail networks."}, {"key": "政策規範", "angle": "政策規範 Policy", "positive": "Pricing and road rules can encourage better travel choices.", "negative": "High charges may unfairly affect low-income drivers.", "chain": "rules/pricing → fewer cars → less congestion → cleaner cities", "example": "Congestion charges can reduce traffic in city centres."}, {"key": "金錢", "angle": "金錢 Cost", "positive": "Reliable public transport can reduce household transport costs.", "negative": "New rail and road systems require large public investment.", "chain": "public investment → better network → less private car use → lower household cost", "example": "Monthly public transport passes can make commuting cheaper."}]}, "Work": {"zh": "工作", "angles": [{"key": "金錢", "angle": "金錢 Income & stability", "positive": "Stable jobs provide income and financial security.", "negative": "People may stay in unsuitable jobs only because they need money.", "chain": "stable income → less financial stress → better family life", "example": "Permanent contracts can give workers greater security."}, {"key": "健康", "angle": "健康 Work-life balance", "positive": "Flexible work can reduce stress and improve well-being.", "negative": "Remote work may blur the boundary between work and private life.", "chain": "flexibility → less commuting → more personal time → lower stress", "example": "Working from home can save commuting time."}, {"key": "個人能力", "angle": "個人能力 Skills & career", "positive": "Training helps employees adapt and progress.", "negative": "Constant training can increase workload.", "chain": "training → stronger skills → better performance → promotion opportunities", "example": "Companies can offer short digital-skills courses."}, {"key": "時間效率", "angle": "時間效率 Productivity", "positive": "Better systems and technology can save time and improve productivity.", "negative": "Pressure to be more productive may increase stress.", "chain": "better tools → faster work → higher output → more efficiency", "example": "Automation can reduce repetitive tasks."}]}, "Globalisation": {"zh": "全球化", "angles": [{"key": "金錢", "angle": "金錢 Economy", "positive": "Global trade creates jobs, investment and lower prices.", "negative": "Local businesses may struggle against large international companies.", "chain": "trade/investment → more business activity → jobs/income", "example": "Foreign companies can create local employment."}, {"key": "人際社會", "angle": "人際社會 Culture", "positive": "People learn about different cultures and ideas.", "negative": "Local traditions may become weaker.", "chain": "more contact → cultural exchange → broader understanding", "example": "International students can introduce new ideas to local campuses."}, {"key": "政策規範", "angle": "政策規範 Cooperation", "positive": "Countries can solve global problems together.", "negative": "International agreements can be slow and difficult.", "chain": "shared rules/resources → coordinated action → larger impact", "example": "Climate change requires international cooperation."}, {"key": "公平機會", "angle": "公平機會 Opportunity", "positive": "Globalisation can give workers and students access to more international opportunities.", "negative": "Benefits may be unevenly distributed between countries and workers.", "chain": "global access → more choices → better opportunities OR wider inequality", "example": "Students can study abroad and gain international experience."}]}}; const MOTHER=["全部", "個人能力", "金錢", "時間效率", "健康", "人際社會", "公平機會", "環境未來", "政策規範"]; const TASK1={"Data": {"zh": "數據圖表", "intro": "The chart compares / illustrates / shows ...", "overview": "Overall, X was the highest, while Y was the lowest. In addition, A increased, whereas B remained relatively stable.", "structures": [["描述數字", "The figure for X stood at approximately 40%."], ["描述占比", "X accounted for / represented / made up 40% of the total."], ["比較", "X was significantly higher than Y, at 60% and 35%, respectively."], ["上升", "The figure increased steadily from 20% to 50%."], ["下降", "Sales fell slightly to around 30,000."], ["穩定", "The figure remained relatively stable at around 40%."], ["波動", "The figure fluctuated between 30% and 45%."], ["高峰", "The number reached a peak of 70% in 2020."]], "sample_title": "Bar chart 示範", "sample": "The bar chart compares the percentage of people using three forms of transport in two cities. Overall, cars were the dominant form of transport in City A, whereas public transport accounted for the largest share in City B. In City A, car use stood at approximately 60%, compared with only 35% in City B. By contrast, public transport represented around 50% in City B, while the figure for City A was roughly 25%. Cycling made up the smallest proportion in both cities, at about 15% and 10%, respectively."}, "Process": {"zh": "流程圖", "intro": "The diagram illustrates how X is produced / how the process of X works.", "overview": "Overall, the process consists of X main stages, beginning with ... and ending with ...", "structures": [["第一步", "Initially, ... / The process begins when ..."], ["下一步", "Next, ... / Following this, ..."], ["被動語態", "The material is transported / heated / mixed / stored ..."], ["之後", "Subsequently, ... / After that, ..."], ["最後", "Finally, ... / In the final stage, ..."], ["自然循環", "This process then repeats / The cycle begins again."]], "sample_title": "Production process 示範", "sample": "The diagram illustrates how bottled fruit juice is produced. Overall, the process consists of six main stages, beginning with the collection of fresh fruit and ending with the delivery of bottled juice to shops. Initially, the fruit is collected and transported to a factory, where it is washed carefully. It is then crushed to extract the juice. Following this, the liquid is filtered and heated before being poured into clean bottles. In the final stage, the bottles are packed into boxes and transported to retail stores."}, "Map": {"zh": "地圖變化", "intro": "The maps show how X changed between YEAR and YEAR.", "overview": "Overall, the area became more developed / residential / accessible, with several new facilities added while some original features were removed.", "structures": [["新增", "A new X was constructed / built in the north."], ["取代", "The X was replaced by a Y."], ["改建", "The X was converted into a Y."], ["擴建", "The X was expanded / extended."], ["保留", "The X remained unchanged."], ["位置", "To the north/south/east/west of ... / next to / opposite ..."]], "sample_title": "Map 示範", "sample": "The maps show how a small town centre changed between 2000 and 2025. Overall, the area became more developed and pedestrian-friendly, with new public facilities added and less space given to cars. In 2000, a large car park occupied the eastern side of the town centre. By 2025, this had been replaced by a public park, while a new multi-storey car park had been constructed in the south. The old market in the centre was converted into a shopping area, and the main road was changed into a pedestrian street. The library in the west remained unchanged."}};
const SKILL={All:"全部",R:"閱讀",L:"聽力",W:"寫作",S:"口說"}; const TOPICS=["全部",...new Set(DATA.map(x=>x.topic))];
let skill="All",topic="全部",priority=false,currentIdea=Object.keys(IDEAS)[0],mother="全部",currentT1="Data";
const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function mk(txt,on=false){const b=document.createElement("button");b.type="button";b.textContent=txt;if(on)b.classList.add("sel");return b}
function renderFilters(){let s=$("#skills");s.innerHTML="";Object.entries(SKILL).forEach(([k,v])=>{let b=mk(v,skill===k);b.onclick=()=>{skill=k;renderFilters();renderVocab()};s.appendChild(b)});let t=$("#topics");t.innerHTML="";TOPICS.forEach(x=>{let b=mk(x,topic===x);b.onclick=()=>{topic=x;renderFilters();renderVocab()};t.appendChild(b)})}
function renderVocab(){let q=$("#search").value.trim().toLowerCase();let list=DATA.filter(e=>(skill==="All"||e.skills.includes(skill))&&(topic==="全部"||e.topic===topic)&&(!priority||e.level==="A"));if(q)list=list.filter(e=>[e.w,e.zh,e.topic,e.note,e.coll,...e.syn].join(" ").toLowerCase().includes(q));$("#count").textContent=`顯示 ${list.length} / ${DATA.length} 組`;$("#cards").innerHTML=list.map(e=>`<article class="card"><div class="row"><div><div class="word">${esc(e.w)}</div><div class="muted">${esc(e.zh)} · ${esc(e.topic)} · ${e.skills.map(k=>SKILL[k]).join("・")}</div></div><span class="tag ${e.level==="A"?"a":""}">${e.level==="A"?"⭐ 必背":"Level "+e.level}</span></div><div class="syns">${e.syn.map(x=>`<span class="syn">${esc(x)}</span>`).join("")}</div><div class="grid3"><div class="box"><b>用法提醒</b><p>${esc(e.note)}</p></div><div class="box"><b>常見搭配</b><p>${esc(e.coll)}</p></div><div class="box"><b>IELTS 例句</b><p>${esc(e.ex)}</p></div></div></article>`).join("")}
$("#search").oninput=renderVocab;$("#priority").onclick=e=>{priority=!priority;e.currentTarget.classList.toggle("primary",priority);renderVocab()};$("#reset").onclick=()=>{$("#search").value="";skill="All";topic="全部";priority=false;$("#priority").classList.remove("primary");renderFilters();renderVocab()};$("#random").onclick=()=>{const e=DATA[Math.floor(Math.random()*DATA.length)];$("#search").value=e.w;renderVocab()};

function renderT1Types(){let box=$("#task1Types");box.innerHTML="";Object.keys(TASK1).forEach(k=>{let b=mk(TASK1[k].zh,k===currentT1);b.onclick=()=>{currentT1=k;renderT1Types();renderTask1()};box.appendChild(b)})}
function renderTask1(){const x=TASK1[currentT1];$("#task1Content").innerHTML=`<div class="card"><div class="section-title">${esc(x.zh)}</div><div class="grid2"><div class="box"><b>Introduction</b><p>${esc(x.intro)}</p></div><div class="box"><b>Overview</b><p>${esc(x.overview)}</p></div></div></div><div class="card"><div class="label">常用描述句型</div>${x.structures.map(s=>`<div class="pattern"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div><div class="card sample"><strong>${esc(x.sample_title)}</strong>${esc(x.sample)}</div>`}

function renderIdeaTopics(){let b=$("#ideaTopics");b.innerHTML="";Object.keys(IDEAS).forEach(k=>{let x=mk(IDEAS[k].zh,k===currentIdea);x.onclick=()=>{currentIdea=k;mother="全部";renderIdeaTopics();renderMother();renderIdeas()};b.appendChild(x)})}
function renderMother(){let b=$("#motherFilters");b.innerHTML="";MOTHER.forEach(k=>{let x=mk(k,k===mother);x.onclick=()=>{mother=k;renderMother();renderIdeas()};b.appendChild(x)})}
function renderIdeas(){const t=IDEAS[currentIdea];const list=t.angles.filter(a=>mother==="全部"||a.key===mother);$("#ideaCards").innerHTML=`<div class="card"><div class="section-title">${esc(t.zh)} / ${esc(currentIdea)}</div><div class="muted">母觀點不是每個主題都一定有。點選後只顯示目前主題可用的角度；若沒有結果，換另一個母觀點即可。</div></div>`+(list.length?list.map(a=>`<article class="card"><div class="angle">${esc(a.angle)}</div><div class="grid2"><div class="box good"><b>✅ 正面</b><p>${esc(a.positive)}</p></div><div class="box bad"><b>⚠️ 負面</b><p>${esc(a.negative)}</p></div></div><div class="box chain" style="margin-top:8px"><b>因果鏈</b><p>${esc(a.chain)}</p></div><div class="box" style="margin-top:8px"><b>簡單例子</b><p>${esc(a.example)}</p></div></article>`).join(""):`<div class="panel muted">這個主題目前沒有「${esc(mother)}」預設觀點。請選其他母觀點或「全部」。</div>`)}

function tab(which){["vocabView","task1View","task2View"].forEach(id=>$("#"+id).classList.add("hidden"));$("#"+which+"View").classList.remove("hidden");$("#tv").classList.toggle("active",which==="vocab");$("#t1").classList.toggle("active",which==="task1");$("#t2").classList.toggle("active",which==="task2")}
$("#tv").onclick=()=>tab("vocab");$("#t1").onclick=()=>tab("task1");$("#t2").onclick=()=>tab("task2");
renderFilters();renderVocab();renderT1Types();renderTask1();renderIdeaTopics();renderMother();renderIdeas();
</script></main></body></html>
